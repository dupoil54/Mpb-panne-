<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Pannes Socadel</title><style>  body{font-family:Arial,sans-serif;margin:0;background:#f2f5fa}  header{background:#0b5ed7;color:#fff;padding:14px;text-align:center;font-weight:bold}  main{max-width:640px;margin:auto;padding:12px}  input,button{width:100%;padding:12px;margin-top:8px;font-size:16px;box-sizing:border-box;border-radius:8px;border:1px solid #bbb}  button{background:#0b5ed7;color:#fff;border:0}  .carte{background:#fff;border-radius:10px;padding:12px;margin-top:12px;box-shadow:0 1px 4px #0002}  .carte a{color:#0b5ed7}  video{width:100%;margin-top:8px;border-radius:8px}  .nouvelle{border-left:6px solid #e53935}  .traitee{border-left:6px solid #2e7d32}</style></head><body><header>Pannes déclarées - Socadel</header><main>  <div id="login">    <input id="email" type="email" placeholder="Votre e-mail administrateur">    <input id="mdp" type="password" placeholder="Mot de passe">    <button id="btnLogin">Se connecter</button>    <div id="msg"></div>  </div>  <div id="liste"></div></main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";// MÊME CONFIGURATION QUE DANS index.htmlconst firebaseConfig = {  apiKey: "VOTRE_API_KEY",  authDomain: "VOTRE_PROJET.firebaseapp.com",  projectId: "VOTRE_PROJET",  storageBucket: "VOTRE_PROJET.appspot.com",  messagingSenderId: "XXXX",  appId: "XXXX"};const app = initializeApp(firebaseConfig);const auth = getAuth(app);const db = getFirestore(app);const storage = getStorage(app);document.getElementById('btnLogin').onclick = () => {  signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('mdp').value)    .catch(() => { document.getElementById('msg').textContent = 'Identifiants incorrects.'; });};onAuthStateChanged(auth, user => {  if (!user) return;  document.getElementById('login').style.display = 'none';  const q = query(collection(db, 'pannes'), orderBy('date', 'desc'));  onSnapshot(q, async snap => {    const liste = document.getElementById('liste');    liste.innerHTML = '';    for (const d of snap.docs) {      const p = d.data();      const date = p.date ? p.date.toDate().toLocaleString('fr-FR') : '';      const carte = document.createElement('div');      carte.className = 'carte ' + (p.statut === 'traitee' ? 'traitee' : 'nouvelle');      let videoHtml = '';      if (p.videoUrl) {        try {          const chemin = p.videoUrl.startsWith('http') ? p.videoUrl : p.videoUrl;          const url = p.videoUrl.startsWith('http') ? p.videoUrl : await getDownloadURL(ref(storage, chemin));          videoHtml = '<video controls src="' + url + '"></video>';        } catch (e) { videoHtml = '<div>Vidéo indisponible</div>'; }      }      carte.innerHTML =        '<b>' + p.nom + '</b> - ' + date + '<br>' +        '<a href="tel:' + p.tel + '">Appeler ' + p.tel + '</a><br>' +        (p.desc ? p.desc + '<br>' : '') +        '<a target="_blank" href="https://www.google.com/maps?q=' + p.position.lat + ',' + p.position.lng + '">Voir sur la carte</a>' +        videoHtml +        '<button data-id="' + d.id + '">Marquer comme traitée</button>';      carte.querySelector('button').onclick = () => updateDoc(doc(db, 'pannes', d.id), { statut: 'traitee' });      liste.appendChild(carte);    }  });});</script></body></html>
