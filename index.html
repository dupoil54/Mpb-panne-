<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b5ed7"><link rel="manifest" href="manifest.json"><title>Socadel - Déclarer une panne</title><style>  body{font-family:Arial,sans-serif;margin:0;background:#f2f5fa;color:#222}  header{background:#0b5ed7;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:bold}  main{max-width:480px;margin:auto;padding:16px}  label{display:block;margin-top:14px;font-weight:bold}  input,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:16px;box-sizing:border-box}  button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:8px;font-size:17px;background:#0b5ed7;color:#fff}  button.sec{background:#555}  #statut{margin-top:14px;font-weight:bold}  .ok{color:#0a7a2f}.err{color:#c00}</style></head><body><header>Socadel - Déclarer une panne</header><main>  <label>Votre nom</label>  <input id="nom" type="text" placeholder="Nom et prénom">  <label>Numéro de téléphone</label>  <input id="tel" type="tel" placeholder="6XX XX XX XX">  <label>Description (facultatif)</label>  <textarea id="desc" rows="3" placeholder="Décrivez brièvement la panne"></textarea>  <button class="sec" id="btnGps">Partager ma position</button><div id="gpsInfo"></div>  <label>Vidéo de la panne (30 secondes maximum)</label>  <input id="video" type="file" accept="video/*" capture="environment">  <button id="btnEnvoyer">Envoyer la déclaration</button>  <div id="statut"></div></main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";// REMPLACEZ PAR VOTRE CONFIGURATION FIREBASEconst firebaseConfig = {  apiKey: "VOTRE_API_KEY",  authDomain: "VOTRE_PROJET.firebaseapp.com",  projectId: "VOTRE_PROJET",  storageBucket: "VOTRE_PROJET.appspot.com",  messagingSenderId: "XXXX",  appId: "XXXX"};const app = initializeApp(firebaseConfig);const db = getFirestore(app);const storage = getStorage(app);let position = null;const statut = document.getElementById('statut');document.getElementById('btnGps').onclick = () => {  document.getElementById('gpsInfo').textContent = 'Recherche de la position...';  navigator.geolocation.getCurrentPosition(    p => {      position = { lat: p.coords.latitude, lng: p.coords.longitude };      document.getElementById('gpsInfo').textContent = 'Position enregistrée.';    },    () => { document.getElementById('gpsInfo').textContent = 'Position refusée. Activez la localisation.'; },    { enableHighAccuracy: true, timeout: 15000 }  );};document.getElementById('btnEnvoyer').onclick = async () => {  const nom = document.getElementById('nom').value.trim();  const tel = document.getElementById('tel').value.trim();  const desc = document.getElementById('desc').value.trim();  const fichier = document.getElementById('video').files[0];  if (!nom || !tel) { statut.className='err'; statut.textContent='Nom et téléphone obligatoires.'; return; }  if (!position) { statut.className='err'; statut.textContent='Veuillez partager votre position.'; return; }  statut.className=''; statut.textContent='Envoi en cours, patientez...';  document.getElementById('btnEnvoyer').disabled = true;  try {    let videoUrl = null;    if (fichier) {      const nomFichier = 'videos/' + Date.now() + '_' + fichier.name.replace(/[^a-zA-Z0-9._-]/g,'_');      const r = ref(storage, nomFichier);      await uploadBytes(r, fichier);      videoUrl = await getDownloadURL(r).catch(() => nomFichier);    }    await addDoc(collection(db, 'pannes'), {      nom, tel, desc, position, videoUrl,      date: serverTimestamp(), statut: 'nouvelle'    });    statut.className='ok';    statut.textContent='Déclaration envoyée. Nous vous contactons rapidement.';  } catch (e) {    statut.className='err';    statut.textContent='Erreur d\'envoi. Vérifiez votre connexion et réessayez.';    document.getElementById('btnEnvoyer').disabled = false;  }};if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body></html>
